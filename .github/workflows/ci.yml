name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: aws-actions/setup-sam@v3
        with:
          version: "1.165.0"
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Browser contract drift
        run: python tools/export_phase65_browser_contracts.py --check
      - name: Phase 6.6 acceptance contract drift
        run: python tools/export_phase66_acceptance_contract.py --check
      - name: Phase 7 publication contract drift
        run: python tools/export_phase7_publication_contract.py --check
      - name: Phase 6 SAM validation
        env:
          SAM_CLI_TELEMETRY: "0"
        run: |
          sam validate --lint --template-file infra/phase6/template.json
          sam validate --lint --template-file infra/phase6/foundation.json
          sam validate --lint --template-file infra/phase6/bootstrap.json
          sam validate --lint --template-file infra/phase6/runtime-role-bootstrap.json
          sam validate --lint --template-file infra/phase6/runtime-update-bootstrap.json
          sam validate --lint --template-file infra/phase6/web-edge-role-bootstrap.json
      - name: Phase 7 SAM validation
        env:
          SAM_CLI_TELEMETRY: "0"
        run: |
          sam validate --lint --template-file infra/phase7/template.json
          sam validate --lint --template-file infra/phase7/canary-template.json
          sam validate --lint --template-file infra/phase7/production-disabled-template.json
          python -m tools.render_phase715c_operations_update \
            --output /tmp/phase715c-operations-update.json
          sam validate --lint --template-file /tmp/phase715c-operations-update.json
      - name: Test
        run: python -m pytest
      - name: Build
        run: python -m build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Verify seller application
        run: npm run check
